apiVersion: apps/v1
kind: Deployment
metadata:
  name: eosa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eosa
  template:
    metadata:
      labels:
        app: eosa
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-admin
          image: ghcr.io/noynto/eosa:latest
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: EOSA_CREATE_DEFAULT_ADMINISTRATOR_IDENTITY_TASK
              value: "true"
            - name: EOSA_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-url
            - name: EOSA_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-username
            - name: EOSA_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-password
            - name: EOSA_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-name
            - name: EOSA_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-secret
            - name: EOSA_CLIENT_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: stripe-secret-key
            - name: EOSA_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: public-base-url
            - name: EOSA_ADMIN_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: admin-base-url
            - name: EOSA_SHIPPING_AMOUNT
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-amount
            - name: EOSA_SHIPPING_FREE_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-free-threshold
            - name: EOSA_SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: smtp-host
            - name: EOSA_SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: smtp-port
            - name: EOSA_SMTP_SECURITY
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: smtp-security
            - name: EOSA_MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: mail-from
            - name: EOSA_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: smtp-username
            - name: EOSA_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: smtp-password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: eosa
          image: ghcr.io/noynto/eosa:latest
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 18080
          env:
            - name: EOSA_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-url
            - name: EOSA_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-username
            - name: EOSA_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-password
            - name: EOSA_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-name
            - name: EOSA_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-secret
            - name: EOSA_CLIENT_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: stripe-secret-key
            - name: EOSA_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: public-base-url
            - name: EOSA_ADMIN_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: admin-base-url
            - name: EOSA_SHIPPING_AMOUNT
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-amount
            - name: EOSA_SHIPPING_FREE_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-free-threshold
            - name: EOSA_SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: smtp-host
            - name: EOSA_SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: smtp-port
            - name: EOSA_SMTP_SECURITY
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: smtp-security
            - name: EOSA_MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: mail-from
            - name: EOSA_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: smtp-username
            - name: EOSA_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: smtp-password
            # Mondial Relay : facultatif au démarrage ; sans ces valeurs, « Pièce fabriquée » échoue avec un message clair.
            - name: EOSA_MONDIAL_RELAY_API_URL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: mondial-relay-api-url
                  optional: true
            - name: EOSA_MONDIAL_RELAY_LOGIN
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: mondial-relay-login
                  optional: true
            - name: EOSA_MONDIAL_RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: mondial-relay-password
                  optional: true
            - name: EOSA_MONDIAL_RELAY_CUSTOMER_ID
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: mondial-relay-customer-id
                  optional: true
            - name: EOSA_SHIPPING_SENDER_NAME
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-sender-name
                  optional: true
            - name: EOSA_SHIPPING_SENDER_LINE1
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-sender-line1
                  optional: true
            - name: EOSA_SHIPPING_SENDER_POSTAL_CODE
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-sender-postal-code
                  optional: true
            - name: EOSA_SHIPPING_SENDER_CITY
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-sender-city
                  optional: true
            - name: EOSA_SHIPPING_SENDER_PHONE
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-sender-phone
                  optional: true
            - name: EOSA_SHIPPING_SENDER_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-sender-email
                  optional: true
            - name: EOSA_SHIPPING_DEFAULT_PARCEL_WEIGHT_GRAMS
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-default-parcel-weight-grams
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
