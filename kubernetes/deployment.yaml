apiVersion: apps/v1
kind: Deployment
metadata:
  name: eosa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eosa
  template:
    metadata:
      labels:
        app: eosa
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: create-admin
          image: ghcr.io/noynto/eosa:latest
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: EOSA_CREATE_DEFAULT_ADMINISTRATOR_IDENTITY_TASK
              value: "true"
            - name: EOSA_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-url
            - name: EOSA_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-username
            - name: EOSA_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-password
            - name: EOSA_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-name
            - name: EOSA_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-secret
            - name: EOSA_CLIENT_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: stripe-secret-key
            - name: EOSA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: base-url
            - name: EOSA_SHIPPING_AMOUNT
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-amount
            - name: EOSA_SHIPPING_FREE_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-free-threshold
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: eosa
          image: ghcr.io/noynto/eosa:latest
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: EOSA_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-url
            - name: EOSA_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-username
            - name: EOSA_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: jdbc-password
            - name: EOSA_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-name
            - name: EOSA_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-secret
            - name: EOSA_CLIENT_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: stripe-secret-key
            - name: EOSA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: base-url
            - name: EOSA_SHIPPING_AMOUNT
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-amount
            - name: EOSA_SHIPPING_FREE_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: eosa-configs
                  key: shipping-free-threshold
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
