apiVersion: apps/v1
kind: Deployment
metadata:
  name: eosa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eosa
  template:
    metadata:
      labels:
        app: eosa
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eosa
          image: ghcr.io/noynto/eosa:latest
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: EOSA_MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: mongo-url
            - name: EOSA_ADMIN_ID
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-id
            - name: EOSA_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eosa-secrets
                  key: admin-secret
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
