apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-create-app-user
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-user
          image: mongo:8
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: username
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: password
            - name: MONGO_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: app-username
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: app-password
          command:
            - /bin/sh
            - -c
            - |
              until mongosh "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin" --eval "db.runCommand({ping:1})" --quiet; do
                echo "Waiting for MongoDB..."; sleep 3;
              done
              mongosh "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin" --eval "
                var appDb = db.getSiblingDB('eosa');
                if (!appDb.getUser('${MONGO_APP_USERNAME}')) {
                  appDb.createUser({ user: '${MONGO_APP_USERNAME}', pwd: '${MONGO_APP_PASSWORD}', roles: [{ role: 'readWrite', db: 'eosa' }] });
                  print('User created.');
                } else {
                  print('User already exists, skipping.');
                }
              "
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}