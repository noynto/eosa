apiVersion: v1
kind: Service
metadata:
  name: eosa
spec:
  selector:
    app: eosa
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
---
# Administration: exposed on its own host (admin.eosa.me) over HTTPS only, so the
# session cookie gets the Secure flag (EOSA_ADMIN_BASE_URL=https://admin.eosa.me).
# Without an Ingress, reach it with: kubectl port-forward svc/eosa-admin 18080:18080
apiVersion: v1
kind: Service
metadata:
  name: eosa-admin
spec:
  selector:
    app: eosa
  ports:
    - port: 18080
      targetPort: admin
  type: ClusterIP
