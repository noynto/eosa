apiVersion: v1
kind: Service
metadata:
  name: eosa
spec:
  selector:
    app: eosa
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
---
# Administration: never expose it through an Ingress.
# Access it with: kubectl port-forward svc/eosa-admin 18080:18080
apiVersion: v1
kind: Service
metadata:
  name: eosa-admin
spec:
  selector:
    app: eosa
  ports:
    - port: 18080
      targetPort: admin
  type: ClusterIP
