# Local environment mirroring kubernetes/: postgres + one-shot create-admin + eosa,
# plus Mailpit, which captures every e-mail sent by the application.
#
#   docker compose up --build -d
#   → storefront      http://localhost:8080
#   → administration  http://localhost:18080  (admin / admin by default)
#   → e-mails         http://localhost:8025   (Mailpit)
#
# One-shot jobs (Kubernetes CronJobs in production) are in the "jobs" profile:
#   docker compose run --rm send-test-email
#
# Works without any configuration. To override a value, set it in a .env file next to
# this one (see .env.example); unset variables fall back to the defaults below.

name: eosa

# Configuration shared by create-admin and eosa. The JDBC URL always targets the
# compose "postgres" service, whatever EOSA_JDBC_URL says in .env.
x-eosa-environment: &eosa-environment
  EOSA_PUBLIC_BASE_URL: ${EOSA_PUBLIC_BASE_URL:-http://localhost:8080}
  EOSA_PUBLIC_SERVER_PORT: ${EOSA_PUBLIC_SERVER_PORT:-8080}
  EOSA_ADMIN_BASE_URL: ${EOSA_ADMIN_BASE_URL:-http://localhost:18080}
  EOSA_ADMIN_SERVER_PORT: ${EOSA_ADMIN_SERVER_PORT:-18080}
  EOSA_ADMIN_NAME: ${EOSA_ADMIN_NAME:-admin}
  EOSA_ADMIN_SECRET: ${EOSA_ADMIN_SECRET:-admin}
  EOSA_JDBC_URL: jdbc:postgresql://postgres:5432/eosa
  EOSA_JDBC_USERNAME: ${EOSA_JDBC_USERNAME:-eosa}
  EOSA_JDBC_PASSWORD: ${EOSA_JDBC_PASSWORD:-eosa}
  EOSA_CLIENT_STRIPE_SECRET_KEY: ${EOSA_CLIENT_STRIPE_SECRET_KEY:-not-configured}
  EOSA_SHIPPING_AMOUNT: ${EOSA_SHIPPING_AMOUNT:-4.90}
  EOSA_SHIPPING_FREE_THRESHOLD: ${EOSA_SHIPPING_FREE_THRESHOLD:-60.00}
  # Mailpit by default; set these in .env to test with the real SMTP server.
  EOSA_SMTP_HOST: ${EOSA_SMTP_HOST:-mailpit}
  EOSA_SMTP_PORT: ${EOSA_SMTP_PORT:-1025}
  EOSA_SMTP_SECURITY: ${EOSA_SMTP_SECURITY:-none}
  EOSA_SMTP_USERNAME: ${EOSA_SMTP_USERNAME:-}
  EOSA_SMTP_PASSWORD: ${EOSA_SMTP_PASSWORD:-}
  EOSA_MAIL_FROM: ${EOSA_MAIL_FROM:-contact@eosa.me}

# Same hardening as the Kubernetes securityContext (read-only root fs, no capabilities).
x-eosa-container: &eosa-container
  image: eosa:local
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eosa
      POSTGRES_USER: ${EOSA_JDBC_USERNAME:-eosa}
      POSTGRES_PASSWORD: ${EOSA_JDBC_PASSWORD:-eosa}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Local tools only (psql, IDE); the app reaches it through the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d eosa"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    # Same limits as kubernetes/postgres.yaml
    mem_limit: 512m
    cpus: 0.5

  # Captures the e-mails instead of delivering them; web UI on http://localhost:8025.
  # The SMTP port (1025) is only reachable from the compose network.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Equivalent of the create-admin initContainer: creates the default administrator
  # (no-op if it already exists) then exits.
  create-admin:
    <<: *eosa-container
    environment:
      <<: *eosa-environment
      EOSA_CREATE_DEFAULT_ADMINISTRATOR_IDENTITY_TASK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  eosa:
    <<: *eosa-container
    # Built once here and reused by create-admin (images are built before any container starts).
    build: .
    pull_policy: build
    environment: *eosa-environment
    ports:
      - "${EOSA_PUBLIC_SERVER_PORT:-8080}:${EOSA_PUBLIC_SERVER_PORT:-8080}"
      # Administration: localhost only, never publish it on all interfaces.
      - "127.0.0.1:${EOSA_ADMIN_SERVER_PORT:-18080}:${EOSA_ADMIN_SERVER_PORT:-18080}"
    depends_on:
      create-admin:
        condition: service_completed_successfully
    restart: unless-stopped
    # Same limits as kubernetes/deployment.yaml
    mem_limit: 512m
    cpus: 0.5

  # One-shot jobs — not started by "docker compose up", run them with "docker compose run --rm <name>".

  # Sends a test e-mail (to Mailpit by default) to check the SMTP configuration and the e-mail layout.
  send-test-email:
    <<: *eosa-container
    profiles: [jobs]
    environment:
      <<: *eosa-environment
      EOSA_SEND_TEST_EMAIL_TO: ${EOSA_SEND_TEST_EMAIL_TO:-test@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
